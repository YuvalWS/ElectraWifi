;PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
upload_protocol = esptool
framework = arduino
build_flags = 
	-D PIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY
	-D DEBUG_SERIAL=0 	; Set to 1 for serial logging (USB debugging), 0 for production
	-D DEBUG_MQTT=1 	; Set to 1 for MQTT logging (wireless debugging), 0 to disable. Subscribe to devices/+/debug/log in your MQTT broker to see logs
	-D PIN_POWER=5
	-D PIN_IR=4
	-D PIN_GREEN_LED=12
	-D PIN_RED_LED=15
	-D PIN_IR_RECV=14
lib_deps = 
	ArduinoJson@<6.17
	IRremoteESP8266
	marvinroger/Homie@^3.0.1
lib_ignore = 
	Async TCP
		; This has a space and conflicts with AsyncTCP (no space) which is required by Homie
monitor_speed = 115200

[env:esp32-devkitc-1]
; works with ESP32-D0WD-V3 (revision v3.1) - need to explicitly set the filesystem to spiffs
; Might need to upload filesystem image separately: pio run --target uploadfs --environment esp32-devkitc-1	
platform = espressif32@6.9.0
board = esp32dev
upload_protocol = esptool
framework = arduino
board_build.filesystem = spiffs
build_flags = 
	-D PIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY
	-D DEBUG_SERIAL=0 	; Set to 1 for serial logging (USB debugging), 0 for production
	-D DEBUG_MQTT=1 	; Set to 1 for MQTT logging (wireless debugging), 0 to disable. Subscribe to devices/+/debug/log in your MQTT broker to see logs
	-D PIN_POWER=5
	-D PIN_IR=23
	-D PIN_GREEN_LED=12
	-D PIN_RED_LED=13
	-D PIN_IR_RECV=14
lib_deps = 
	ArduinoJson@<6.17
	IRremoteESP8266
	marvinroger/Homie@^3.0.1
lib_ignore = 
	Async TCP
		; This has a space and conflicts with AsyncTCP (no space) which is required by Homie
monitor_speed = 115200

[env:esp12e]
; target ARDUINO_ESP8266_ESP12
platform = espressif8266
;platform = espressif8266
board = esp12e
upload_protocol = esptool
framework = arduino
; ADD -D ELECTRAWIFI_NO_IR_RCV  to remove the IR reception code
build_flags = -D PIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY
	-D PIN_POWER=5
	-D PIN_IR=4
	-D PIN_GREEN_LED=12
	-D PIN_RED_LED=15
	-D PIN_IR_RECV=14
lib_deps = 
	ArduinoJson@<6.17
	IRremoteESP8266
	marvinroger/Homie@^3.0.1
lib_ignore = 
	ESPAsyncTCP
monitor_speed = 115200


;if using target esp01 with plaform espresif8266 at the latest version (instead of 2.5.0), 
;you might need to modify some code in the Homie library since the way the URL client has been handled has changed. 
[env:esp01]
;platform = espressif8266@2.5.0
;target define  ARDUINO_ESP8266_ESP01
platform = espressif8266
board = esp01_1m
upload_protocol = esptool
framework = arduino
build_flags = -D PIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY
	-D PIN_POWER=2
	-D PIN_IR=0
	-D PIN_IR_RECV=14
lib_deps = 
	ArduinoJson@<6.17
	IRremoteESP8266
	marvinroger/Homie@^3.0.1
lib_ignore = 
	ESPAsyncTCP
monitor_speed = 115200

[env:d1_mini]
platform = espressif8266
board = d1_mini
upload_protocol = esptool
framework = arduino
build_flags = 
    -D PIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY
;	-D APP_DEBUG_SERIAL=1
;	-D DEBUG_MQTT=1
;    -D ELECTRAWIFI_NO_IR_RCV   ; Optional: adds the flag to skip IR receiver code if you didn't install the sensor
lib_deps = 
    ArduinoJson@<6.17
    IRremoteESP8266
    marvinroger/Homie@^3.0.1
lib_ignore = 
    ESPAsyncTCP
monitor_speed = 115200